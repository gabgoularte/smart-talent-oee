services:
  db:
    image: postgres:16
    container_name: smart-talent-oee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-talent-oee-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MODEL_PATH: /app/modelo_manutencao.joblib
      LIMIAR_ATENCAO: "0.30"
    ports:
      - "8000:8000"
    volumes:
      - ./ml-model/models/modelo_manutencao.joblib:/app/modelo_manutencao.joblib:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: